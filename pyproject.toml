[project]
name = "hotel-voice-agent"
version = "0.1.0"
description = "24/7 AI phone receptionist for a hotel, in Italian and English (ElevenLabs, Groq, FastAPI, Supabase)"
authors = [
    { name = "Magesh Sundaravel", email = "magesh094@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langfuse>=5.1.0",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py312"
