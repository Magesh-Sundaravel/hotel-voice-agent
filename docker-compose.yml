# FastAPI backend. Run with: docker compose up api
# Supabase and Langfuse Cloud are hosted, so they are not part of this file (see docs/decisions/003).
# ngrok runs on the host: `ngrok http --url=<your-static-domain> 8000`.

services:
  api:
    build: .
    # Langfuse keys and LANGFUSE_BASE_URL come from .env.
    env_file: .env
    ports:
      - 8000:8000
